[package]
name = "esp32-flasher"
version = "0.1.0"
description = "ESP32 批量烧录工具 (Tauri)"
authors = ["Kevin"]
edition = "2021"

[lib]
name = "esp32_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.8"
base64 = "0.22"
espflash = { version = "4.6", default-features = false, features = ["serialport"] }
